appId: com.youtubedownload.app
productName: YoutubeDownload
copyright: Copyright © 2026 Winking
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - src/main/**/*
  - src/preload.js
  - package.json
# 将 resources/ 下的 yt-dlp.exe / ffmpeg.exe 随包发布（可选，缺省时应用首次运行自动下载）
extraResources:
  - from: resources
    to: resources
    filter:
      - "**/*"
win:
  target:
    - nsis
    - portable
  requestedExecutionLevel: asInvoker
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: YoutubeDownload
  artifactName: YoutubeDownload-Setup-${version}.exe
portable:
  artifactName: YoutubeDownload-portable-${version}.exe
electronDownload:
  mirror: https://cdn.npmmirror.com/binaries/electron/
